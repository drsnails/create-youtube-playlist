<!doctype html><html lang="en"><body>
<!-- Badge markup reduced from the members-only report; titles and IDs replaced. -->
<yt-lockup-view-model>
  <h3><a class="ytLockupMetadataViewModelTitle" href="/watch?v=aaaaaaaaaaa">Members only videos explained</a></h3>
  <yt-content-metadata-view-model>
    <div class="ytContentMetadataViewModelMetadataRow"><span aria-label="1 thousand views">1K</span><span aria-label="1 day ago">1d ago</span></div>
  </yt-content-metadata-view-model>
</yt-lockup-view-model>
<yt-lockup-view-model>
  <h3><a class="ytLockupMetadataViewModelTitle" href="/watch?v=bbbbbbbbbbb">Exclusive extended episode</a></h3>
  <yt-content-metadata-view-model>
    <div class="ytContentMetadataViewModelMetadataRow"><span aria-label="2 days ago">2d ago</span></div>
    <div class="ytContentMetadataViewModelMetadataRow ytContentMetadataViewModelMetadataRowMetadataRowWrap">
      <div class="ytContentMetadataViewModelBadge"><yt-badge-view-model class="ytBadgeViewModelHost">
        <badge-shape class="ytBadgeShapeHost ytBadgeShapeCommerce ytBadgeShapeModern ytBadgeShapeTypography"><div class="ytBadgeShapeText">Members only</div></badge-shape>
      </yt-badge-view-model></div>
    </div>
  </yt-content-metadata-view-model>
</yt-lockup-view-model>
<yt-lockup-view-model>
  <h3><a class="ytLockupMetadataViewModelTitle" href="/watch?v=ccccccccccc">Public episode</a></h3>
  <yt-content-metadata-view-model>
    <div class="ytContentMetadataViewModelMetadataRow"><span aria-label="2 thousand views">2K</span><span aria-label="3 days ago">3d ago</span></div>
  </yt-content-metadata-view-model>
</yt-lockup-view-model>
<ytd-grid-video-renderer>
  <a id="video-title" href="/watch?v=ddddddddddd">Exclusive older episode</a>
  <div id="metadata-line"><span>4 days ago</span></div>
  <ytd-badge-supported-renderer aria-label="Members only"></ytd-badge-supported-renderer>
</ytd-grid-video-renderer>
</body></html>
