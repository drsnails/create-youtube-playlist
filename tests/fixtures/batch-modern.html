<!doctype html><html lang="en"><body>
<!-- Info-bar structure reduced from the fallback report; queue rows are synthetic. -->
<yt-lockup-view-model>
  <a href="/watch?v=aaaaaaaaaaa">Example video</a>
  <h3><a href="/watch?v=aaaaaaaaaaa">Example video</a></h3>
  <yt-content-metadata-view-model><span>1 day ago</span><span>100 views</span></yt-content-metadata-view-model>
  <button aria-label="More actions" aria-haspopup="menu">More</button>
</yt-lockup-view-model>
<ytd-miniplayer class="ytdMiniplayerComponentHost ytdMiniplayerComponentVisible">
  <a class="ytp-prev-button" href="/watch?v=zzzzzzzzzzz&amp;list=TLPQexample">Previous</a>
  <a class="ytp-next-button" href="/watch?v=zzzzzzzzzzz&amp;list=TLPQexample">Next</a>
  <button class="ytp-playlist-menu-button" aria-label="Playlist" hidden>
    <span class="ytp-playlist-menu-button-text">1/1</span>
  </button>
  <div class="ytp-playlist-menu" hidden><div class="ytp-playlist-menu-items"></div></div>
  <ytd-miniplayer-info-bar class="ytdMiniplayerInfoBarHost ytdMiniplayerInfoBarHasPlaylistData">
    <div class="ytdMiniplayerInfoBarContent">
      <h1 class="ytdMiniplayerInfoBarTitle">Example queued video</h1>
      <div class="ytdMiniplayerInfoBarSubtitle">
        <h1><span class="ytdMiniplayerInfoBarSubtitleText">Queue</span></h1>
        <div class="ytdMiniplayerInfoBarPlaylistIndex"><span class="ytdMiniplayerInfoBarPlaylistIndexTextDivider">•</span><span>1 / 1</span></div>
      </div>
    </div>
    <div class="ytdMiniplayerInfoBarExpand"><button title="" aria-expanded="false">Expand queue</button></div>
  </ytd-miniplayer-info-bar>
  <ytd-playlist-panel-renderer hidden></ytd-playlist-panel-renderer>
  <a class="ytp-modern-videowall-still" href="/watch?v=rrrrrrrrrrr">Unrelated recommendation</a>
</ytd-miniplayer>
</body></html>
