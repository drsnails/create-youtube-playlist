<!doctype html><html lang="en"><body>
<!-- Miniplayer chrome reduced from the timing report; list entries are synthetic. -->
<yt-lockup-view-model>
  <a href="/watch?v=aaaaaaaaaaa">Example video</a>
  <h3><a href="/watch?v=aaaaaaaaaaa">Example video</a></h3>
  <yt-content-metadata-view-model><span>1 day ago</span><span>100 views</span></yt-content-metadata-view-model>
  <button aria-label="More actions" aria-haspopup="menu">More</button>
</yt-lockup-view-model>
<ytd-miniplayer>
  <a class="ytp-prev-button" href="/watch?v=zzzzzzzzzzz">Previous</a>
  <a class="ytp-next-button" href="/watch?v=zzzzzzzzzzz">Next</a>
  <button class="ytp-playlist-menu-button" aria-label="Playlist" aria-haspopup="true">
    <span class="ytp-playlist-menu-button-title">Playlist: Queue</span>
    <span class="ytp-playlist-menu-button-text">1/1</span>
  </button>
  <div class="ytp-playlist-menu" role="dialog" hidden>
    <button class="ytp-playlist-menu-close" aria-label="Close">Close</button>
    <div class="ytp-playlist-menu-items" role="menu"></div>
  </div>
  <a class="ytp-modern-videowall-still" href="/watch?v=rrrrrrrrrrr">Unrelated recommendation</a>
</ytd-miniplayer>
</body></html>
